name: Release

on:
  push:
    branches: [main]
    paths:
      - brew/VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag, without or with v prefix. Defaults to brew/VERSION."
        required: false
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      created: ${{ steps.compute.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(cat brew/VERSION)"
          fi
          VERSION="${VERSION#v}"
          TAG="v$VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "ERROR: release version must look like 0.1.0 or 0.1.0-beta.1, got: $VERSION"
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.compute.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.compute.outputs.tag }}" -m "Release ${{ steps.compute.outputs.tag }}"
          git push origin "${{ steps.compute.outputs.tag }}"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    # macos-latest provides codesign and notarytool for the signed macOS builds.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # go.mod has `replace github.com/repoguide/repoguide-core => ../repoguide-core`,
      # a relative path that only exists in the local umbrella layout. Recreate it
      # here by checking out repoguide-core as a sibling directory.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          path: repoguide-cli

      # repoguide-core is public, so no token is needed to check it out.
      - uses: actions/checkout@v4
        with:
          repository: repoguide-dev/repoguide-core
          path: repoguide-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: repoguide-cli/go.mod

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/repoguide-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --config brew/.goreleaser.yaml --clean
          workdir: repoguide-cli
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Yoav Schneider (8YW7223V89)"

      - name: Notarize macOS archives
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        working-directory: repoguide-cli
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/repoguide_*_darwin_*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "No macOS archives found to notarize."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            submission="$(xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --output-format json)"
            submission_id="$(plutil -extract id raw - <<< "$submission")"
            echo "Submitted $archive to Apple (submission: $submission_id)."

            deadline=$((SECONDS + 1800))
            while true; do
              info="$(xcrun notarytool info "$submission_id" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --output-format json)"
              status="$(plutil -extract status raw - <<< "$info")"
              echo "Notarization $submission_id: $status"
              case "$status" in
                Accepted) break ;;
                Invalid|Rejected)
                  echo "$info"
                  exit 1
                  ;;
              esac
              if (( SECONDS >= deadline )); then
                echo "Apple did not finish notarization within 30 minutes. Submission: $submission_id"
                exit 1
              fi
              sleep 30
            done
          done

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/repoguide-signing.keychain-db" || true
